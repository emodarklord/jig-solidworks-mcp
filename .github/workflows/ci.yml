name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # Hosted runners have no SOLIDWORKS, so only the projects without COM interop build here.
    # The full solution and live tests run on a machine with SOLIDWORKS installed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet format tests/Jig.Tests --verify-no-changes
      - run: dotnet build tests/Jig.Tests -c Release
      - run: dotnet test tests/Jig.Tests -c Release --no-build
